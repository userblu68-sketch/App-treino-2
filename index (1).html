
<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DailyFit IA - Treino Inteligente</title>
    
    <!-- Bibliotecas MediaPipe para IA -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        :root {
            --primary: #00d1b2;
            --dark: #1a1a1a;
            --card-bg: #2d2d2d;
            --text: #f5f5f5;
            --accent: #ffdd57;
            --danger: #ff3860;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark);
            color: var(--text);
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        header {
            background-color: #111;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary);
        }

        .container {
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #444;
        }

        .stat-card h3 { margin: 0; color: var(--primary); font-size: 0.9em; }
        .stat-card p { font-size: 1.5em; font-weight: bold; margin: 5px 0; }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .exercise-item {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
        }

        .tag-ia {
            background: #6b46c1;
            color: white;
            font-size: 0.65em;
            padding: 3px 6px;
            border-radius: 4px;
            margin-left: 5px;
        }

        .btn-start {
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-start.camera-btn { background: #6b46c1; color: white; }

        .paywall {
            background: linear-gradient(135deg, #3e2723, #1a1a1a);
            padding: 20px;
            border-radius: 15px;
            margin-top: 30px;
            border: 1px solid var(--accent);
            text-align: center;
        }

        .btn-buy {
            background: var(--accent);
            color: black;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            display: block;
            margin-top: 10px;
        }

        /* Câmara View */
        #camera-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: black;
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #video-container { position: relative; width: 100%; max-width: 600px; }
        video, canvas { width: 100%; height: auto; border-radius: 10px; }
        canvas { position: absolute; top: 0; left: 0; }

        .hud {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 1001;
        }

        .counter-box {
            background: rgba(0,0,0,0.8);
            color: var(--primary);
            padding: 10px 30px;
            border-radius: 20px;
            font-size: 3em;
            font-weight: bold;
            border: 2px solid var(--primary);
        }

        .btn-close {
            background: var(--danger);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="main-menu">
    <header>
        <h1>DailyFit IA</h1>
        <p>A câmara conta o teu progresso!</p>
    </header>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><h3>PONTOS</h3><p id="xp">1.250</p></div>
            <div class="stat-card"><h3>OFENSIVA</h3><p>12 Dias</p></div>
        </div>

        <div class="exercise-list">
            <div class="exercise-item">
                <div><strong>Agachamento</strong> <span class="tag-ia">IA</span></div>
                <button class="btn-start camera-btn" onclick="iniciarCamera('Agachamento')">▶ INICIAR IA</button>
            </div>
            <div class="exercise-item">
                <div><strong>Flexão</strong> <span class="tag-ia">IA</span></div>
                <button class="btn-start camera-btn" onclick="iniciarCamera('Flexao')">▶ INICIAR IA</button>
            </div>
        </div>

        <div class="paywall">
            <h3 style="color: var(--accent);">Seja Premium</h3>
            <a href="https://pay.kiwify.com.br/TEU9n1T" class="btn-buy">ASSINAR AGORA</a>
        </div>
    </div>
</div>

<div id="camera-view">
    <h2 id="ex-title" style="color:white;">A carregar...</h2>
    <div id="video-container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
        <div class="hud">
            <div class="counter-box" id="rep-counter">0</div>
            <button class="btn-close" onclick="pararCamera()">SAIR</button>
        </div>
    </div>
</div>

<script>
    const videoElement = document.getElementById('input_video');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const repCounterEl = document.getElementById('rep-counter');
    
    let camera_instance = null;
    let pose_instance = null;
    let currentEx = "";
    let repCount = 0;
    let state = "up";

    function calculateAngle(a, b, c) {
        let radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
        let angle = Math.abs(radians * 180.0 / Math.PI);
        return angle > 180.0 ? 360 - angle : angle;
    }

    function onResults(results) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
        canvasCtx.save();
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        
        if (results.poseLandmarks) {
            drawConnectors(canvasCtx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00d1b2', lineWidth: 4});
            let lm = results.poseLandmarks;
            let angle = 0;

            if (currentEx === 'Agachamento') {
                angle = calculateAngle(lm[24], lm[26], lm[28]);
                if (angle > 160) { if(state === "down") repCount++; state = "up"; }
                if (angle < 90) state = "down";
            } else {
                angle = calculateAngle(lm[12], lm[14], lm[16]);
                if (angle > 160) { if(state === "down") repCount++; state = "up"; }
                if (angle < 90) state = "down";
            }
            repCounterEl.innerText = repCount;
        }
        canvasCtx.restore();
    }

    async function iniciarCamera(ex) {
        currentEx = ex; repCount = 0;
        document.getElementById('ex-title').innerText = ex;
        document.getElementById('main-menu').style.display = 'none';
        document.getElementById('camera-view').style.display = 'flex';

        if (!pose_instance) {
            pose_instance = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
            pose_instance.setOptions({modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5});
            pose_instance.onResults(onResults);
        }
        if (!camera_instance) {
            camera_instance = new Camera(videoElement, {onFrame: async () => { await pose_instance.send({image: videoElement}); }, width: 640, height: 480});
        }
        camera_instance.start();
    }

    function pararCamera() {
        if (camera_instance) camera_instance.stop();
        document.getElementById('camera-view').style.display = 'none';
        document.getElementById('main-menu').style.display = 'block';
        alert("Treino finalizado! Repetições: " + repCount);
    }
</script>
</body>
</html>
